name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # `npm ci` at the repo root resolves all workspaces (apps/*, packages/*,
      # functions) and links @watchmarks/shared into node_modules.
      - run: npm ci
      - run: npm run lint
      # vitest config includes both `src/**/*.test.ts` and
      # `functions/src/**/*.test.ts`, so this single `npm test` covers both.
      - run: npm test
      - run: npm run build:ci

  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Type-check the Cloud Functions package via its own tsconfig (strict,
      # commonjs target). Catches issues the bundler's loose mode hides.
      - name: Functions type-check & build
        working-directory: functions
        run: npx tsc --noEmit
